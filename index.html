<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal Trader">
<title>Trading Journal &amp; SOP Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#090a0f; --bg-subtle:#11131c; --card:#151824; --card-hover:#1a1e2e;
  --border:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.16);
  --fg:#f3f4f6; --fg-subtle:#9ca3af; --muted:#6b7280;
  --accent:#6366f1; --accent-hover:#4f46e5; --accent-glow:rgba(99,102,241,.25); --accent-bg:rgba(99,102,241,.12);
  --profit:#10b981; --profit-bg:rgba(16,185,129,.12);
  --loss:#f43f5e; --loss-bg:rgba(244,63,94,.12);
  --warn:#f59e0b; --warn-bg:rgba(245,158,11,.12);
  --blue:#3b82f6; --blue-bg:rgba(59,130,246,.12);
  --purple:#a855f7; --purple-bg:rgba(168,85,247,.12);
  --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  --shadow-card:0 4px 20px -2px rgba(0,0,0,.5);
  --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); min-height:100vh;
  font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-size:14px; line-height:1.5;
  overflow-x:hidden;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
/* background */
.bg-blob{position:fixed;pointer-events:none;filter:blur(140px);opacity:.35;z-index:0}
.bg-blob.a{width:520px;height:520px;left:-160px;top:-180px;background:#6366f1}
.bg-blob.b{width:460px;height:460px;right:-140px;top:40%;background:#10b981;opacity:.22}
.bg-blob.c{width:540px;height:540px;left:20%;bottom:-260px;background:#a855f7;opacity:.2}
.bg-dots{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:32px 32px;}
/* scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}

.wrap{position:relative;z-index:1}
header{
  position:sticky;top:0;z-index:50;
  background:rgba(9,10,15,.72);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);
  border-bottom:1px solid var(--border);
  padding:calc(10px + var(--safe-top)) 16px 10px;
}
.header-inner{display:flex;align-items:center;gap:14px;flex-wrap:nowrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.3px;white-space:nowrap;flex-shrink:0}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--profit);box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:pulse-dot 2.2s infinite}
@keyframes pulse-dot{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}70%{box-shadow:0 0 0 9px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.header-actions{display:flex;align-items:center;gap:7px;margin-left:auto;overflow-x:auto;scrollbar-width:none;padding:2px}
.header-actions::-webkit-scrollbar{display:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--border);background:var(--card);color:var(--fg);
  padding:8px 13px;border-radius:var(--radius-sm);font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:.16s;white-space:nowrap;flex-shrink:0;
}
.btn:hover{background:var(--card-hover);border-color:var(--border-hover)}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#4f46e5);border-color:transparent;color:#fff;box-shadow:0 4px 18px var(--accent-glow)}
.btn-primary:hover{background:linear-gradient(135deg,#7174f5,#4f46e5);box-shadow:0 6px 24px var(--accent-glow)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--loss-bg);border-color:rgba(244,63,94,.3);color:#fda4af}
.btn-danger:hover{background:rgba(244,63,94,.2)}
.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--radius-sm);font-size:14px}
.btn-xs{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
main{padding:16px;max-width:1440px;margin:0 auto;padding-bottom:calc(96px + var(--safe-bottom))}
@media(min-width:768px){main{padding:24px}}
/* banner */
#libBanner{display:none;background:var(--loss-bg);border:1px solid rgba(244,63,94,.3);color:#fda4af;padding:10px 14px;border-radius:var(--radius-md);font-size:12.5px;margin-bottom:12px;display:none;align-items:center;gap:9px}
#libBanner.show{display:flex}
/* sync bar */
.syncbar{display:flex;justify-content:flex-end;margin-bottom:12px}
.sync-pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--fg-subtle);
  background:var(--card);border:1px solid var(--border);padding:5px 11px;border-radius:99px;cursor:pointer;transition:.16s}
.sync-pill:hover{border-color:var(--border-hover);color:var(--fg)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sync-dot.ok{background:var(--profit);box-shadow:0 0 8px rgba(16,185,129,.7)}
.sync-dot.err{background:var(--loss);box-shadow:0 0 8px rgba(244,63,94,.7)}
.sync-dot.pending{background:var(--warn);box-shadow:0 0 8px rgba(245,158,11,.7)}
/* stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:768px){.stat-grid{grid-template-columns:repeat(3,1fr);gap:12px}}
@media(min-width:1024px){.stat-grid{grid-template-columns:1.6fr repeat(5,1fr)}}
.stat{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px;box-shadow:var(--shadow-card);overflow:hidden}
.stat .label{font-size:11px;font-weight:600;color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat .value{font-size:20px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.stat .sub{font-size:11px;color:var(--muted);margin-top:5px}
.stat.big{grid-column:span 2;background:linear-gradient(135deg,#1e2a4a,#2a1e4a);border-color:rgba(99,102,241,.25)}
.stat.big .value{font-size:28px;color:#fff}
.stat.big .label{color:#a5b4fc}
.stat.big .sub{color:#94a3b8}
@media(min-width:768px){.stat.big{grid-column:span 1}}
.stat .strip{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0 4px 4px 0}
.pos{color:var(--profit)} .neg{color:var(--loss)} .neutral{color:var(--fg-subtle)}
/* panels */
.panels{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px;align-items:start}
@media(min-width:768px){.panels{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.panels{grid-template-columns:repeat(3,1fr)}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;min-height:180px}
.panel-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.panel-head i{font-size:14px;color:var(--accent)}
.panel-head h3{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.2px;flex:1}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg-subtle);color:var(--fg-subtle);border:1px solid var(--border);white-space:nowrap}
.chip.done{background:var(--profit-bg);color:var(--profit);border-color:rgba(16,185,129,.3)}
.check-list{display:flex;flex-direction:column;gap:5px}
.check-item{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;transition:.14s;cursor:pointer}
.check-item:hover{background:var(--bg-subtle)}
.check-item.on{background:var(--accent-bg)}
.check-item input{appearance:none;-webkit-appearance:none;width:17px;height:17px;border:1.5px solid var(--border-hover);border-radius:5px;flex-shrink:0;margin-top:1px;cursor:pointer;position:relative;transition:.14s;background:transparent}
.check-item input:checked{background:var(--accent);border-color:var(--accent)}
.check-item input:checked::after{content:'';position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.check-item span{font-size:12.5px;line-height:1.4;transition:.14s}
.check-item input:checked+span{text-decoration:line-through;opacity:.5}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px;margin-top:8px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:.14s}
.thumbs img:hover{border-color:var(--border-hover);transform:scale(1.05)}
/* sessions */
.sess-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.sess-row:last-child{border-bottom:none}
.sess-row .nm{font-size:12.5px;font-weight:600;flex:1}
.sess-row .hr{font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
.badge.open{background:var(--profit-bg);color:var(--profit)}
.badge.closed{background:var(--bg-subtle);color:var(--muted)}
/* charts */
.charts{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
@media(min-width:768px){.charts{grid-template-columns:1.6fr 1fr}}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card)}
.chart-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.chart-head h3{margin:0;font-size:13.5px;font-weight:700;flex:1}
.chart-body{position:relative;height:260px}
.chart-body.doughnut{height:220px}
/* table */
.table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden}
.table-card .th{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--border)}
.table-card .th h3{margin:0;font-size:13.5px;font-weight:700;flex:1}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{text-align:left;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg-subtle)}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg-subtle)}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase}
.tag.buy{background:var(--profit-bg);color:var(--profit)}
.tag.sell{background:var(--loss-bg);color:var(--loss)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:12.5px}
.empty i{font-size:26px;display:block;margin-bottom:10px;opacity:.4}
/* FAB */
.fab{display:none}
@media(max-width:767px){
  .fab{display:inline-flex;position:fixed;right:16px;bottom:calc(16px + var(--safe-bottom));z-index:60;
    padding:13px 20px;border-radius:99px;box-shadow:0 8px 28px var(--accent-glow)}
  .header-actions .btn-primary{display:none}
}
@media(max-width:479px){
  .btn .lbl{display:none}
  .header-actions{gap:5px}
  .logo{font-size:13px}
}
/* modal */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(4,6,12,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:none;align-items:flex-end;justify-content:center;padding:0}
.overlay.show{display:flex}
@media(min-width:768px){.overlay{align-items:center;padding:24px}}
.modal{background:var(--card);border:1px solid var(--border);width:100%;max-width:560px;max-height:92vh;
  display:flex;flex-direction:column;border-radius:28px 28px 0 0;animation:sheetIn .34s cubic-bezier(.16,1,.3,1)}
@media(min-width:768px){.modal{border-radius:var(--radius-lg);animation:dlgIn .24s cubic-bezier(.16,1,.3,1);max-height:88vh}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes dlgIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.handle{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:9px auto 0}
@media(min-width:768px){.handle{display:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:15px;font-weight:700;flex:1}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px calc(12px + var(--safe-bottom));border-top:1px solid var(--border);background:var(--card);position:sticky;bottom:0}
@media(min-width:768px){.modal-foot{padding:12px 18px}}
/* form */
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--fg-subtle);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg-subtle);border:1px solid var(--border);color:var(--fg);
  padding:9px 11px;border-radius:var(--radius-sm);font-family:inherit;font-size:13px;transition:.14s;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.field textarea{resize:vertical;min-height:64px}
.field input[type=file]{padding:7px;font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:0;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px}
.seg button{flex:1;border:none;background:transparent;color:var(--fg-subtle);padding:7px;border-radius:7px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:.14s}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on.loss{background:var(--loss)}
.seg button.on.be{background:#4b5563}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
/* toast */
#toasts{position:fixed;top:calc(14px + var(--safe-top));right:14px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:10px 14px;font-size:12.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:320px;
  animation:toastIn .3s cubic-bezier(.16,1,.3,1);pointer-events:auto}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{to{transform:translateX(120%);opacity:0}}
.toast.success{border-color:rgba(16,185,129,.35)} .toast.success i{color:var(--profit)}
.toast.error{border-color:rgba(244,63,94,.35)} .toast.error i{color:var(--loss)}
.toast.info i{color:var(--blue)}
/* lightbox */
#lightbox{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lightbox.show{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.split{height:1px;background:var(--border);margin:14px 0}
.sub-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px}
.list-edit{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.list-edit .le{display:flex;gap:7px;align-items:center;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 9px}
.list-edit .le input{flex:1;background:transparent;border:none;color:var(--fg);font-family:inherit;font-size:12.5px;outline:none;min-width:0}


/* visual polish */
@media (hover:hover){
  .btn:hover{transform:translateY(-1px)}
  .panel:hover,.stat:hover,.chart-card:hover,.table-card:hover{border-color:var(--border-hover);box-shadow:0 8px 30px -8px rgba(0,0,0,.65)}
}
.panel,.stat,.chart-card,.table-card{transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.empty{background:var(--card-hover);border:1px dashed var(--border-hover);border-radius:var(--radius-md);padding:28px 18px}
.empty i{font-size:30px;opacity:.5;margin-bottom:10px}
.sop-group{background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 10px 8px;margin-bottom:8px}
.sop-group:last-child{border-bottom:0}
.check-item{transition:background .15s ease,transform .15s ease}
.check-item:has(input:checked){background:var(--accent-bg)}
.modal-body{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

</style>
</head>
<body>
<div class="bg-blob a"></div><div class="bg-blob b"></div><div class="bg-blob c"></div><div class="bg-dots"></div>
<div id="toasts"></div>
<div id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" alt=""></div>

<div class="wrap">
<header>
  <div class="header-inner">
    <div class="logo"><span class="dot"></span><span>Trading Journal <span style="color:var(--muted);font-weight:600">&amp; SOP</span></span></div>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="openBalanceModal()"><i class="fa-solid fa-wallet"></i><span class="lbl">Saldo</span></button>
      <button class="btn btn-ghost" onclick="openSopModal()"><i class="fa-solid fa-clipboard-check"></i><span class="lbl">SOP</span></button>
      <button class="btn btn-ghost" onclick="openDataModal()"><i class="fa-solid fa-table-list"></i><span class="lbl">Data</span></button>
      <button class="btn btn-ghost" onclick="exportData()"><i class="fa-solid fa-file-export"></i><span class="lbl">Export</span></button>
      <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()"><i class="fa-solid fa-file-import"></i><span class="lbl">Import</span></button>
      <input type="file" id="importFile" accept=".json,.csv,.xlsx" style="display:none" onchange="importData(event)">
      <button class="btn btn-ghost" onclick="openDriveModal()"><i class="fa-solid fa-gear"></i><span class="lbl">Drive</span></button>
      <button class="btn btn-icon" title="Push ke Drive" onclick="drivePush()"><i class="fa-solid fa-cloud-arrow-up"></i></button>
      <button class="btn btn-icon" title="Pull dari Drive" onclick="drivePull()"><i class="fa-solid fa-cloud-arrow-down"></i></button>
      <button class="btn btn-primary" onclick="openTradeModal()"><i class="fa-solid fa-plus"></i><span class="lbl">Tambah Trade</span></button>
    </div>
  </div>
</header>

<main>
  <div id="libBanner"><i class="fa-solid fa-triangle-exclamation"></i><span id="libBannerText"></span></div>
  <div class="syncbar">
    <div class="sync-pill" onclick="openDriveModal()">
      <span class="sync-dot" id="syncDot"></span><span id="syncText">Drive belum dikonfigurasi</span>
    </div>
  </div>

  <div class="stat-grid" id="statGrid"></div>
  <div class="panels" id="panels"></div>
  <div class="charts">
    <div class="chart-card">
      <div class="chart-head"><i class="fa-solid fa-chart-line" style="color:var(--profit)"></i><h3>Equity Curve</h3><span class="chip mono" id="equityChip">—</span></div>
      <div class="chart-body"><canvas id="equityChart"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-head"><i class="fa-solid fa-chart-pie" style="color:var(--purple)"></i><h3>Win/Loss Distribution</h3></div>
      <div class="chart-body doughnut"><canvas id="distChart"></canvas></div>
    </div>
  </div>

  <div class="table-card">

/* ============ STORAGE ============ */
function storage(){ return (typeof localforage !== 'undefined' && localforage) ? localforage : {

};}

function migrateState(){

  var ok = Array.isArray(state.sop) && state.sop.length &&
    groups.every(function(g){ return state.sop.some(function(it){ return it.group === g && typeof it.text === 'string' && it.text.trim(); }); });

      !state.rules.every(function(it){ return it && typeof it.text === 'string' && it.text.trim(); })) {

function loadState(){

function saveState(){

/* ============ UTIL ============ */
function escapeHtml(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function num(v, def){ var n = parseFloat(v); return isFinite(n) ? n : (def === undefined ? 0 : def); }
function fmtMoney(v){
  var neg = v < 0; var a = Math.abs(v);
  var s = a.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (neg ? '-$' : '$') + s;
}
function fmtCompact(v){
  var a = Math.abs(v); var s;
  if (a >= 1e6) s = (v/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  else if (a >= 1e3) s = (v/1e3).toFixed(1).replace(/\.0$/,'') + 'k';
  else s = v.toFixed(0);
  return '$' + s;
}
function fmtDate(d){ if(!d) return '—'; var p = String(d).split('T')[0].split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : d; }
function todayStr(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStrNY(){
  var now = new Date();
  var nyt = new Date(now.toLocaleString('en-US', {timeZone:'America/New_York'}));
  return nyt.getFullYear()+'-'+String(nyt.getMonth()+1).padStart(2,'0')+'-'+String(nyt.getDate()).padStart(2,'0');
}
function getNYDate(d){
  var date = new Date(d || new Date());
  var nyt = new Date(date.toLocaleString('en-US', {timeZone:'America/New_York'}));
  return nyt.getFullYear()+'-'+String(nyt.getMonth()+1).padStart(2,'0')+'-'+String(nyt.getDate()).padStart(2,'0');
}
function countTradesNYToday(){
  var today = todayStrNY();
  return (state.trades || []).filter(function(t){ return getNYDate(t.date) === today; }).length;
}
function toast(msg, type){
  type = type || 'info';
  var ic = type==='success' ? 'fa-circle-check' : type==='error' ? 'fa-circle-exclamation' : 'fa-circle-info';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<i class="fa-solid '+ic+'"></i><span>'+escapeHtml(msg)+'</span>';
  document.getElementById('toasts').appendChild(el);
  setTimeout(function(){ el.classList.add('out'); setTimeout(function(){ el.remove(); }, 260); }, 3200);
}

/* ============ COMPUTE ============ */
function signedProfit(t){
  if (t.type) return t.type === 'deposit' ? t.amount : -t.amount;
  return num(t.pnl);
}
function computeStats(){
  var s = {initial: num(state.initialBalance), deposits:0, withdraws:0, pnl:0, wins:0, losses:0, be:0,
    grossProfit:0, grossLoss:0};
  state.transactions.forEach(function(t){ if(t.type==='deposit') s.deposits += num(t.amount); else s.withdraws += num(t.amount); });
  state.trades.forEach(function(t){
    var p = num(t.pnl); s.pnl += p;
    if (t.result === 'win') { s.wins++; if(p>0) s.grossProfit += p; else s.grossProfit += Math.max(p,0); }
    else if (t.result === 'loss') { s.losses++; s.grossLoss += Math.abs(p); }
    else s.be++;
  });
  s.equity = s.initial + s.deposits - s.withdraws + s.pnl;
  s.decided = s.wins + s.losses;
  s.winRate = s.decided ? (s.wins / s.decided) * 100 : 0;
  s.roi = s.initial ? (s.pnl / s.initial) * 100 : 0;
  s.pf = s.grossLoss > 0 ? (s.grossProfit / s.grossLoss) : (s.grossProfit > 0 ? Infinity : null);
  s.totalTrades = state.trades.length;
  return s;
}

/* ============ RENDER ============ */
function renderStats(){
  var s = computeStats();

  var cards = [

    {cls:'', strip:'var(--blue)', label:'ROI', value:(s.roi>=0?'+':'')+s.roi.toFixed(2)+'%', valCls:s.roi>=0?'pos':'neg', sub:'dari saldo awal'},
    {cls:'', strip:'var(--purple)', label:'Win Rate', value:s.winRate.toFixed(1)+'%', valCls:'', sub:s.decided+' trade diputuskan'},
    {cls:'', strip:'var(--warn)', label:'Profit Factor', value:pfTxt, valCls:'', sub:'GP '+fmtMoney(s.grossProfit)+' / GL '+fmtMoney(s.grossLoss)},
    {cls:'', strip:'var(--accent)', label:'Total Trades', value:String(s.totalTrades), valCls:'', sub:s.deposits>0||s.withdraws>0 ? (fmtMoney(s.deposits)+' dep • '+fmtMoney(s.withdraws)+' wd') : 'belum ada transaksi'}
  ];
  document.getElementById('statGrid').innerHTML = cards.map(function(c){
    return '<div class="stat '+c.cls+'">'+(c.strip?'<div class="strip" style="background:'+c.strip+'"></div>':'')+

      '<div class="value mono '+c.valCls+'">'+escapeHtml(c.value)+'</div>'+

  }).join('');
}

  var el = document.getElementById('panels');
  var grp = function(g){ return state.sop.filter(function(it){return it.group===g;}); };

                 panelHtml('sop-confirmation','Entry Confirmation','fa-circle-check',grp('confirmation'),'confirmation') +
                 panelHtml('sop-wick','Wick Size Candle','fa-chart-simple',grp('wick'),'wick') +
                 panelHtml('sop-entry','Entry','fa-flag-checkered',grp('entry'),'entry') +
                 sessionsHtml();

}
function panelHtml(key, title, icon, list, sopGroup){
  var done = list.filter(function(i){return i.done;}).length;
  var all = list.length && done === list.length;
  var sections = [];
  if (sopGroup){
    sections.push('<div class="check-list">'+list.map(function(it){
      var gi = state.sop.indexOf(it);
      if (gi < 0) return '';
      return '<label class="check-item '+(it.done?'on':'')+'"><input type="checkbox" '+(it.done?'checked':'')+
        ' onchange="toggleCheck(\'sop\','+gi+',this.checked)"><span>'+escapeHtml(it.text)+'</span></label>';
    }).join('') || '<div class="empty">Belum ada item</div>')+'</div>';
  } else if (key === 'sop'){
    var groups = ['narrative','profile','reversal','confirmation','wick','entry'];
    var labels = {narrative:'Narrative',profile:'Profile',reversal:'True Reversal Variant',confirmation:'Entry Confirmation',wick:'Wick Size Candle',entry:'Entry'};
    groups.forEach(function(g){
      var items = list.filter(function(it){return it.group === g;});
      if (!items.length) return;
      sections.push('<div class="sop-group" style="margin-bottom:8px"><h4 style="margin:0 0 4px 0;font-size:12px;font-weight:600;color:var(--accent)">'+escapeHtml(labels[g])+'</h4>'+
        '<div class="check-list">'+items.map(function(it,i){
          var gi = list.indexOf(it);
          return '<label class="check-item '+(it.done?'on':'')+'"><input type="checkbox" '+(it.done?'checked':'')+
            ' onchange="toggleCheck(\''+key+'\','+gi+',this.checked)"><span>'+escapeHtml(it.text)+'</span></label>';
        }).join('')+'</div></div>');
    });
  } else {
    sections.push('<div class="check-list">'+list.map(function(it,i){
      return '<label class="check-item '+(it.done?'on':'')+'"><input type="checkbox" '+(it.done?'checked':'')+
        ' onchange="toggleCheck(\''+key+'\','+i+',this.checked)"><span>'+escapeHtml(it.text)+'</span></label>';
    }).join('') || '<div class="empty">Belum ada item</div>')+'</div>';
  }
  var headerChip = (key==='sop' || sopGroup) ? (sopGroup?'<span class="chip '+(all?'done':'')+'">'+done+'/'+list.length+'</span>':'') : '<span class="chip '+(all?'done':'')+'">'+done+'/'+list.length+'</span>';
  return '<div class="panel"><div class="panel-head"><i class="fa-solid '+icon+'"></i><h3>'+escapeHtml(title)+'</h3>'+headerChip+'</div>'
    +sections.join('')
    +'<div style="margin-top:auto;padding-top:10px"><button class="btn btn-xs" onclick="openListModal(\''+key+'\')"><i class="fa-solid fa-pen"></i>Kelola</button></div></div>';
}
function renderThumbs(){
  // thumbnails dimuat di dalam modal kelola; panel cukup cek gambar pertama
  var html = '';
  [['rules', state.rules], ['sop', state.sop]].forEach(function(pair){
    state[pair[0]].forEach(function(it, i){
      if (it.images && it.images.length) {
        html += '<img src="'+it.images[0]+'" alt="" onclick="openLightbox(\''+it.images[0]+'\')" style="display:none">';
      }
    });
  });
  // no-op: gambar tampil di modal kelola
}
function nyParts(){
  var now = new Date();
  var opts = {timeZone:'America/New_York', hour12:false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'};
  var str = now.toLocaleString('en-US', opts);
  var p = str.split(/[\s,/-]+/);
  return {
    month:p[0], day:p[1], year:p[2], hour:String(parseInt(p[3],10)).padStart(2,'0'), minute:p[4],
    clock:String(parseInt(p[3],10)).padStart(2,'0')+':'+p[4]
  };
}
function nyOffset(){
  var now = new Date();
  var utc = new Date(now.toLocaleString('en-US',{timeZone:'UTC'}));
  var ny  = new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'}));
  var off = Math.round((ny - utc)/3600000);
  return {val:off, label:(off<0?'UTC'+off:'UTC+'+off), dst:(off===-4)};
}
function sessionsHtml(){
  var ny = nyParts(); var off = nyOffset();
  var h = parseInt(ny.hour,10) + parseInt(ny.minute,10)/60;
  var sess = [
    {n:'Asia',     open: h>=0  && h<9,  h:'00:00-09:00 UTC'},
    {n:'London',   open: h>=2  && h<11, h:'02:00-11:00 NY'},
    {n:'New York', open: h>=8  && h<17, h:'08:00-17:00 NY'}
  ];
  var sessNY = [
    {n:'Asia',     utc:'00:00-09:00 UTC'},
    {n:'London',   utc:'07:00-16:00 UTC'},
    {n:'New York', utc:'13:00-22:00 UTC'}
  ];
  return '<div class="panel" id="sessions"><div class="panel-head"><i class="fa-solid fa-globe"></i><h3>Status Sesi Global</h3>'+
    '<span class="chip mono">'+ny.clock+' NY ('+off.label+(off.dst?' EDT':' EST')+')</span></div>'+
    sess.map(function(s, i){
      return '<div class="sess-row"><span class="nm">'+s.n+'</span><span class="hr">'+sessNY[i].utc+'</span>'+
        '<span class="badge '+(s.open?'open':'closed')+'">'+(s.open?'Buka':'Tutup')+'</span></div>';
    }).join('')+
    '<div class="hint" style="margin-top:8px">Zona acuan: America/New_York, DST otomatis (EST UTC-5 / EDT UTC-4).</div>'+
    '<div class="hint">Trade hari ini (NY): '+countTradesNYToday()+'/3 — sisa '+Math.max(0,3-countTradesNYToday())+'.</div>'+
    '</div>';
}


function renderTrades(){
  var body = document.getElementById('tradeBody');
  if (!state.trades.length){
    body.innerHTML = '<tr><td colspan="9"><div class="empty"><i class="fa-regular fa-folder-open"></i>Belum ada trade. Klik "Tambah Trade" untuk mulai mencatat.</div></td></tr>';
    return;
  }
  var sorted = state.trades.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  body.innerHTML = sorted.map(function(t){
    var cls = t.result==='win'?'pos':(t.result==='loss'?'neg':'neutral');
    var resLabel = t.result==='win'?'Win':(t.result==='loss'?'Loss':'BE');
    var shots = (t.images && t.images.length) ? '<span class="thumbs" style="display:inline-flex;width:auto">'+t.images.slice(0,5).map(function(s){return '<img src="'+s+'" style="width:26px;height:26px;aspect-ratio:auto" onclick="openLightbox(\''+s+'\')">';}).join('')+'</span>' : '';
    return '<tr><td class="mono">'+escapeHtml(fmtDate(t.date))+'</td><td><b>'+escapeHtml(t.pair||'—')+'</b></td>'+
      '<td>'+(t.dir?'<span class="tag '+t.dir+'">'+escapeHtml(t.dir==='buy'?'Buy':'Sell')+'</span>':'—')+'</td>'+
      '<td class="mono">'+escapeHtml(t.entry||'—')+'</td><td class="mono">'+escapeHtml(t.exit||'—')+'</td>'+
      '<td class="mono">'+escapeHtml(t.rr||'—')+'</td><td><span class="'+cls+'" style="font-weight:700">'+resLabel+'</span></td>'+
      '<td class="mono '+cls+'" style="font-weight:700">'+(num(t.pnl)>=0?'+':'')+fmtMoney(num(t.pnl))+'</td>'+
      '<td>'+shots+' <button class="btn btn-icon btn-xs" onclick="editTrade(\''+t.id+'\')"><i class="fa-solid fa-pen"></i></button> '+
      '<button class="btn btn-icon btn-xs btn-danger" onclick="deleteTrade(\''+t.id+'\')"><i class="fa-solid fa-trash"></i></button></td></tr>';
  }).join('');
}

/* ============ CHARTS ============ */
function renderCharts(){
  if (typeof Chart === 'undefined') return;
  var s = computeStats();
  var events = [];
  state.trades.forEach(function(t){ if(t.date) events.push({date:t.date, delta:num(t.pnl), kind:'trade', label:(t.pair||'Trade')+' '+(t.result||'')}); });
  state.transactions.forEach(function(t){ if(t.date) events.push({date:t.date, delta:(t.type==='deposit'?num(t.amount):-num(t.amount)), kind:t.type, label:(t.type==='deposit'?'Deposit':'Withdraw')+' '+fmtMoney(num(t.amount))}); });
  events.sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
  var labels = ['Start']; var data = [s.initial]; var acc = s.initial;
  events.forEach(function(e){ acc += e.delta; labels.push(fmtDate(e.date)); data.push(acc); });
  var last = data[data.length-1];
  var lineColor = last >= s.initial ? '#10b981' : '#f43f5e';
  var chip = document.getElementById('equityChip');
  if (chip) chip.textContent = fmtMoney(last);

  var ctx = document.getElementById('equityChart');
  if (!ctx) return;
  if (charts.equity) charts.equity.destroy();

  var crosshairPlugin = {
    id:'crosshair',
    afterDatasetsDraw:function(chart){
      if (chart.tooltip && chart.tooltip.getActiveElements().length){
        var a = chart.tooltip.getActiveElements()[0];
        var x = a.element.x; var top = chart.chartArea.top; var bot = chart.chartArea.bottom;
        var c = chart.ctx; c.save(); c.beginPath(); c.setLineDash([4,4]); c.strokeStyle='rgba(255,255,255,.25)';
        c.moveTo(x,top); c.lineTo(x,bot); c.stroke(); c.restore();
      }
    }
  };

  charts.equity = new Chart(ctx, {
    type:'line',
    data:{ labels:labels, datasets:[{
      data:data, borderColor:lineColor, borderWidth:2,
      pointBackgroundColor:'#0f1118', pointBorderColor:lineColor, pointBorderWidth:2, pointRadius:3, pointHoverRadius:5,
      tension:.28, fill:true,
      backgroundColor:function(c){
        var g = c.chart.ctx.createLinearGradient(0,0,0,260);
        g.addColorStop(0, lineColor+'55'); g.addColorStop(1, lineColor+'00'); return g;
      }
    }]},
    options:{
      responsive:true, maintainAspectRatio:false, animation:{duration:500},
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#0c0e16', borderColor:'rgba(255,255,255,.1)', borderWidth:1,
          titleColor:'#f3f4f6', bodyColor:'#9ca3af', padding:10, displayColors:false,
          callbacks:{
            label:function(c){
              var i = c.dataIndex; var prev = i>0 ? data[i-1] : s.initial - (data[0]-s.initial);
              var ch = data[i] - (i>0?data[i-1]:s.initial);
              return ['Equity: '+fmtMoney(data[i]), 'Perubahan: '+(ch>=0?'+':'')+fmtMoney(ch)];
            }
          }
        }
      },
      scales:{

  });

  });

  });
}

var editingShots = [];
function renderTradeShots(shots){
  editingShots = (shots || []).slice();
  var host = document.getElementById('tShots'); if(!host) return;
  host.innerHTML = editingShots.map(function(src, j){
    return '<div style="position:relative"><img src="'+src+'" onclick="openLightbox(\''+src+'\')">'+
      '<button type="button" class="btn btn-icon btn-xs btn-danger" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;font-size:9px" onclick="delTradeShot('+j+')"><i class="fa-solid fa-xmark"></i></button></div>';
  }).join('');
  var cnt = document.getElementById('tShotCount');
  if (cnt) cnt.textContent = editingShots.length + '/5';
}
function addTradeShots(ev){
  var files = ev.target.files || [];
  for (var i=0; i<files.length; i++){
    if (editingShots.length >= 5){ toast('Maksimal 5 screenshot', 'error'); break; }
    var f = files[i];
    (function(file){
      var r = new FileReader();
      r.onload = function(){
        if (editingShots.length >= 5) return;
        editingShots.push(r.result);
        renderTradeShots(editingShots);
        toast('Screenshot ditambahkan', 'success');
      };
      r.readAsDataURL(file);
    })(f);
  }
  ev.target.value = '';
}
function delTradeShot(j){ editingShots.splice(j,1); renderTradeShots(editingShots); }
var sopChecksCache = {narrative:[],profile:[],reversal:[],confirmation:[],wick:null,entry:null};
function toggleSopCheck(grp, key, checked){
  if (!sopChecksCache[grp]) sopChecksCache[grp] = [];
  var idx = sopChecksCache[grp].indexOf(key);
  if (checked && idx < 0) sopChecksCache[grp].push(key);
  else if (!checked && idx >= 0) sopChecksCache[grp].splice(idx,1);
}

function updateWick(key){ sopChecksCache.wick = key; }
function updateEntry(key){ sopChecksCache.entry = key; }

function download(filename, content, type){

  var url = URL.createObjectURL(blob); var a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}

    return {Tanggal:t.date, Pair:t.pair, Arah:t.dir, Entry:num(t.entry, t.entry), Exit:num(t.exit, t.exit),
      SL:num(t.sl, t.sl), TP:num(t.tp, t.tp), RR:t.rr, Hasil:t.result, PnL:num(t.pnl), Catatan:t.note||''};
  });
}
function exportCsv(){
  var rows = tradeRowsForSheet();
  if (!rows.length){ toast('Belum ada trade', 'error'); return; }
  var keys = Object.keys(rows[0]);
  var csv = keys.join(',') + '\n' + rows.map(function(r){
    return keys.map(function(k){ var v = r[k] == null ? '' : String(r[k]); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(',');
  }).join('\n');
  download('trades-'+todayStr()+'.csv', csv, 'text/csv');
  toast('CSV diunduh', 'success');
}
function exportXlsx(){
  if (typeof XLSX === 'undefined'){ toast('SheetJS tidak tersedia', 'error'); return; }
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tradeRowsForSheet()), 'Trades');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.transactions.map(function(t){return {Tanggal:t.date, Jenis:t.type, Jumlah:t.amount};})), 'Transaksi');
  XLSX.writeFile(wb, 'trading-journal-'+todayStr()+'.xlsx');
  toast('Excel diunduh', 'success');
}
function resetAll(){
  if (!confirm('Hapus SEMUA data? Tindakan ini tidak bisa dibatalkan.')) return;
  state.trades = []; state.transactions = []; state.initialBalance = 1000;
  saveState(); renderAll(); closeModal(); toast('Data direset', 'info');
}
function importData(ev){
  var f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  var name = f.name.toLowerCase();
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      if (name.endsWith('.json')){
        var obj = JSON.parse(e.target.result);
        if (obj.trades) state.trades = obj.trades;
        if (obj.transactions) state.transactions = obj.transactions;
        if (obj.rules) state.rules = obj.rules;
        if (obj.sop) state.sop = obj.sop;
        if (obj.initialBalance != null) state.initialBalance = num(obj.initialBalance, 1000);
        if (obj.drive) state.drive = obj.drive;
      } else if (name.endsWith('.csv') || name.endsWith('.xlsx') || name.endsWith('.xls')){
        if (typeof XLSX === 'undefined'){ toast('SheetJS tidak tersedia', 'error'); return; }
        var wb = name.endsWith('.csv') ? XLSX.read(e.target.result, {type:'string'}) : XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        var sh = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sh);
        rows.forEach(function(r){
          state.trades.push({
            id:uid(), date: String(r.Tanggal||r.date||todayStr()).slice(0,10), pair:r.Pair||r.pair||'—',
            dir:r.Arah||r.dir||'buy', entry:String(r.Entry||''), exit:String(r.Exit||''),
            rr:String(r.RR||''), result:(r.Hasil||r.result||'win').toLowerCase(),
            pnl:num(r.PnL||r.pnl), note:r.Catatan||r.note||''
          });
        });
      } else { toast('Format tidak didukung', 'error'); return; }
      saveState(); renderAll(); closeModal(); toast('Data berhasil diimport', 'success');
    }catch(err){ console.warn(err); toast('Gagal import: '+err.message, 'error'); }
  };
  if (name.endsWith('.json') || name.endsWith('.csv')) reader.readAsText(f);
  else reader.readAsArrayBuffer(f);
}

/* ============ DRIVE SYNC ============ */
function updateSyncBar(){
  var dot = document.getElementById('syncDot'), txt = document.getElementById('syncText');
  var url = (state.drive && state.drive.url) || '';
  if (!url){ dot.className='sync-dot'; txt.textContent='Drive belum dikonfigurasi'; }
  else { dot.className='sync-dot ok'; txt.textContent='Drive siap • push/pull manual'; }
}
function openDriveModal(){
  var d = state.drive || {};
  var body = '<p class="hint" style="margin-bottom:12px">Sync memakai Google Apps Script Web App. Deploy Code.gs sebagai Web App (akses: Anyone), lalu tempel URL-nya di sini.</p>'+
    '<div class="field"><label>Web App URL</label><input id="dUrl" value="'+escapeHtml(d.url||'')+'" placeholder="https://script.google.com/macros/s/.../exec"></div>'+
    '<div class="field"><label>Token Rahasia (opsional)</label><input id="dToken" type="password" value="'+escapeHtml(d.token||'')+'" placeholder="token yang sama dengan di Code.gs"></div>'+
    '<div class="split"></div><p class="sub-h">Uji Koneksi</p>'+
    '<button class="btn btn-xs" onclick="driveTest()"><i class="fa-solid fa-plug"></i>Tes Koneksi</button>';
  openModal('Konfigurasi Drive', body,
    '<button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveDrive()"><i class="fa-solid fa-check"></i>Simpan</button>');
}
function saveDrive(){
  state.drive = {url:document.getElementById('dUrl').value.trim(), token:document.getElementById('dToken').value.trim()};
  saveState(); updateSyncBar(); closeModal(); toast('Konfigurasi disimpan', 'success');
}
function driveTest(){
  var url = document.getElementById('dUrl').value.trim();
  if (!url){ toast('URL kosong', 'error'); return; }
  fetch(url + '?action=ping').then(function(r){return r.text();}).then(function(t){
    toast('Koneksi OK: '+t.slice(0,40), 'success');
    var dot=document.getElementById('syncDot'); if(dot){dot.className='sync-dot ok';}
  }).catch(function(err){ toast('Gagal: '+err.message, 'error'); });
}
function drivePush(){
  if (!state.drive.url){ openDriveModal(); return; }
  var dot = document.getElementById('syncDot'); dot.className='sync-dot pending';
  fetch(state.drive.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'save', token:state.drive.token, data:state})})
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res.ok){ dot.className='sync-dot ok'; toast('Data terkirim ke Drive', 'success'); }
      else { dot.className='sync-dot err'; toast('Gagal push: '+(res.error||'unknown'), 'error'); }
    })
    .catch(function(err){ dot.className='sync-dot err'; toast('Gagal push: '+err.message, 'error'); });
}
function drivePull(){
  if (!state.drive.url){ openDriveModal(); return; }
  if (!confirm('Tarik data dari Drive? Data lokal akan ditimpa.')) return;
  var dot = document.getElementById('syncDot'); dot.className='sync-dot pending';
  fetch(state.drive.url+'?action=load&token='+encodeURIComponent(state.drive.token||''))
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res.ok && res.data){
        state = Object.assign(state, res.data); saveState(); renderAll();
        dot.className='sync-dot ok'; toast('Data dari Drive dimuat', 'success');
      } else { dot.className='sync-dot err'; toast('Gagal pull: '+(res.error||'kosong'), 'error'); }
    })
    .catch(function(err){ dot.className='sync-dot err'; toast('Gagal pull: '+err.message, 'error'); });
}

/* ============ INIT ============ */
function checkLibs(){
  var missing = [];
  if (typeof Chart === 'undefined') missing.push('Chart.js');
  if (typeof localforage === 'undefined') missing.push('localForage');
  if (typeof XLSX === 'undefined') missing.push('SheetJS');
  if (missing.length){
    var b = document.getElementById('libBanner');
    document.getElementById('libBannerText').textContent = 'Library gagal dimuat: '+missing.join(', ')+'. Data tetap tersimpan lokal (localStorage), chart/export nonaktif.';
    b.classList.add('show');
  }
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ closeModal(); closeLightbox(); } });
setInterval(function(){ renderPanels(); }, 60000);
checkLibs();
loadState();
</script>
